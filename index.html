<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<meta name="theme-color" content="#e65100">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<title>汽修记账助手</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#1a1a2e;--card:#16213e;--card2:#0f3460;--accent:#e65100;--accent2:#ff8f00;--text:#fff;--text2:#aab;--green:#2e7d32;--green2:#43a047;--red:#c62828;--radius:16px}
html,body{height:100%;overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);font-size:20px;line-height:1.5;display:flex;flex-direction:column}
header{background:var(--accent);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;z-index:10}
header h1{font-size:20px;font-weight:700}
header button{background:none;border:none;color:#fff;font-size:24px;padding:8px;cursor:pointer;border-radius:50%;width:44px;height:44px}
.view{display:none;flex-direction:column;flex:1;overflow:hidden;padding:16px}
.view.active{display:flex}
/* ===== 首页 ===== */
#homeView{justify-content:space-between;align-items:center}
.hero-icon{font-size:80px;margin-bottom:20px;text-align:center}
.big-start-btn{width:100%;padding:36px 20px;font-size:32px;font-weight:700;background:var(--accent);border:none;border-radius:24px;color:#fff;cursor:pointer;box-shadow:0 8px 32px rgba(230,81,0,.4);transition:transform .15s;display:flex;flex-direction:column;align-items:center;gap:8px}
.big-start-btn:active{transform:scale(.96)}
.big-start-btn .sub{font-size:16px;font-weight:400;opacity:.8}
.home-stats{width:100%;background:var(--card);border-radius:var(--radius);padding:16px;margin-top:16px}
.home-stats .hs-row{display:flex;justify-content:space-between;padding:6px 0;font-size:18px}
.home-stats .hs-label{color:var(--text2)}
.home-stats .hs-val{font-weight:700;color:var(--accent2)}
/* ===== 向导屏 ===== */
.guide{justify-content:center;gap:20px}
.guide-question{text-align:center;font-size:28px;font-weight:700;line-height:1.6;margin-bottom:8px}
.guide-hint{text-align:center;font-size:18px;color:var(--text2);margin-bottom:16px}
.big-input-wrap{width:100%;position:relative}
.big-input{width:100%;background:var(--card2);border:3px solid var(--accent);color:var(--text);padding:24px;border-radius:16px;font-size:28px;text-align:center;outline:none;min-height:90px}
.big-input:focus{border-color:var(--accent2)}
.big-btn{width:100%;padding:24px;border:none;border-radius:16px;font-size:24px;font-weight:700;cursor:pointer;color:#fff}
.big-btn.green{background:var(--green2)}
.big-btn.red{background:var(--red)}
.big-btn.orange{background:var(--accent)}
.big-btn:active{opacity:.8}
.btn-row{display:flex;gap:12px;width:100%}
.btn-row .big-btn{flex:1}
.part-box{width:100%;background:var(--card);border-radius:var(--radius);padding:16px;margin-bottom:16px}
.part-box .pb-title{font-size:20px;font-weight:700;color:var(--accent2);margin-bottom:8px}
.part-box .pb-row{display:flex;justify-content:space-between;font-size:18px;padding:4px 0}
.part-box .pb-row .l{color:var(--text2)}
.part-box .pb-row .v{font-weight:700}
/* ===== 收据 ===== */
#receiptView{background:#eee;padding:0;overflow-y:auto}
.receipt-page{background:#fff;color:#000;width:100%;min-height:100%;padding:24px 20px;font-family:"KaiTi","STKaiti","SimSun",serif}
.rp-title{text-align:center;font-size:26px;font-weight:700;letter-spacing:4px;border-bottom:3px double #000;padding-bottom:8px;margin-bottom:10px}
.rp-shop{text-align:center;font-size:18px;margin-bottom:4px}
.rp-meta{display:flex;justify-content:space-between;font-size:15px;margin-bottom:6px}
.rp-contact{text-align:center;font-size:14px;margin-bottom:10px;border-bottom:1px solid #000;padding-bottom:8px}
table.rp-items{width:100%;border-collapse:collapse;font-size:15px;margin:8px 0}
table.rp-items th,table.rp-items td{border:1px solid #000;padding:6px 4px;text-align:center}
table.rp-items th{background:#f0f0f0}
.rp-total{display:flex;justify-content:space-between;font-size:17px;padding:6px 0;border-bottom:1px solid #000}
.rp-total .big{font-size:22px;font-weight:700}
.rp-note{margin-top:10px;font-size:14px;border:1px solid #000;padding:8px;min-height:40px}
.rp-sign{display:flex;justify-content:space-between;font-size:15px;margin-top:24px}
.rp-foot{text-align:center;font-size:12px;color:#666;margin-top:16px}
.receipt-actions{position:sticky;bottom:0;background:var(--bg);padding:12px;display:flex;gap:12px}
.receipt-actions .big-btn{font-size:20px;padding:16px}
/* ===== 设置 ===== */
#settingsView{overflow-y:auto}
.settings-section{background:var(--card);border-radius:var(--radius);padding:16px;margin-bottom:12px}
.settings-section h3{font-size:18px;color:var(--accent2);margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid rgba(255,255,255,.1)}
.setting-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;font-size:17px}
.setting-row label{color:var(--text2)}
.setting-row input{background:var(--card2);border:1px solid rgba(255,255,255,.1);color:var(--text);padding:8px 12px;border-radius:8px;font-size:16px;width:180px;text-align:right}
.setting-row input.full{width:100%;text-align:left}
.settings-btn{width:100%;padding:16px;border:none;border-radius:12px;font-size:18px;font-weight:700;cursor:pointer;margin-top:10px;color:#fff}
.settings-btn.orange{background:var(--accent)}
.settings-btn.green{background:var(--green2)}
.settings-btn.red{background:var(--red)}
/* ===== 历史列表 ===== */
#historyView{overflow-y:auto}
.hist-card{background:var(--card);border-radius:var(--radius);padding:14px;margin-bottom:10px;border-left:4px solid var(--accent)}
.hist-card .hc-top{display:flex;justify-content:space-between;font-size:18px;font-weight:700;margin-bottom:6px}
.hist-card .hc-plate{color:var(--accent2)}
.hist-card .hc-sum{display:flex;justify-content:space-between;font-size:15px;color:var(--text2)}
.toast{position:fixed;bottom:120px;left:50%;transform:translateX(-50%);background:var(--card);color:var(--text);padding:14px 24px;border-radius:12px;font-size:17px;box-shadow:0 4px 20px rgba(0,0,0,.5);z-index:300;border-left:4px solid var(--accent);opacity:0;transition:opacity .3s;pointer-events:none;max-width:90%;text-align:center}
.toast.show{opacity:1}
.speak-indicator{position:fixed;top:60px;right:12px;background:var(--accent2);color:#000;padding:4px 10px;border-radius:20px;font-size:13px;font-weight:700;display:none;z-index:200}
.speak-indicator.on{display:block;animation:pulse .6s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
</style>
</head>
<body>
<header>
  <h1 id="headerTitle">🔧 汽修记账</h1>
  <button onclick="showView('homeView')" aria-label="主页">🏠</button>
</header>

<span class="speak-indicator" id="speakIndicator">🔊 播报中</span>

<!-- 首页 -->
<div id="homeView" class="view active">
  <div style="flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center">
    <span class="hero-icon">🔧</span>
    <button class="big-start-btn" onclick="startFlow()">
      📷 开始记账
      <span class="sub">拍照或说话, 不用写字</span>
    </button>
  </div>
  <div class="home-stats">
    <div class="hs-row"><span class="hs-label">📅 今天</span><span class="hs-val" id="todayCount">0 单</span></div>
    <div class="hs-row"><span class="hs-label">💰 今天实收</span><span class="hs-val" id="todayIncome">¥0</span></div>
    <div class="hs-row"><span class="hs-label">📈 今天利润</span><span class="hs-val" id="todayProfit">¥0</span></div>
  </div>
  <div style="display:flex;gap:12px;margin-top:16px">
    <button class="big-btn orange" style="font-size:18px;padding:16px" onclick="showView('historyView')">📋 历史账目</button>
    <button class="big-btn orange" style="font-size:18px;padding:16px" onclick="showView('settingsView')">⚙️ 设置</button>
  </div>
</div>

<!-- 向导 -->
<div id="guideView" class="view guide">
  <div style="width:100%">
    <div class="guide-question" id="guideQuestion"></div>
    <div class="guide-hint" id="guideHint"></div>
  </div>
  <div id="guideBody" style="width:100%"></div>
  <div class="btn-row" id="guideActions"></div>
</div>

<!-- 收据 -->
<div id="receiptView" class="view">
  <div class="receipt-page" id="receiptPage"></div>
  <div class="receipt-actions">
    <button class="big-btn orange" onclick="saveReceiptImage()">📷 保存图片</button>
    <button class="big-btn green" onclick="finishRecord()">✅ 完成</button>
  </div>
</div>

<!-- 历史 -->
<div id="historyView" class="view">
  <div id="historyList"></div>
</div>

<!-- 设置 -->
<div id="settingsView" class="view">
  <div class="settings-section">
    <h3>🏪 店铺信息 (显示在收据上)</h3>
    <div class="setting-row"><label>店名</label><input type="text" id="setShopName" placeholder="如: 老王汽修" style="width:100%;text-align:left"></div>
    <div class="setting-row"><label>地址</label><input type="text" id="setShopAddr" placeholder="店铺地址" style="width:100%;text-align:left"></div>
    <div class="setting-row"><label>电话</label><input type="tel" id="setShopPhone" placeholder="联系电话" style="width:100%;text-align:left"></div>
  </div>
  <div class="settings-section">
    <h3>☁️ 同步 (数据胶囊 WebDAV)</h3>
    <div class="setting-row"><label>地址</label><input type="url" id="setWebdavUrl" placeholder="https://..." style="width:100%;text-align:left"></div>
    <div class="setting-row"><label>用户名</label><input type="text" id="setWebdavUser" style="width:100%;text-align:left"></div>
    <div class="setting-row"><label>密码</label><input type="password" id="setWebdavPass" style="width:100%;text-align:left"></div>
    <button class="settings-btn green" onclick="backupToWebdav()">☁️ 备份到数据胶囊</button>
    <button class="settings-btn orange" onclick="restoreFromWebdav()" style="margin-top:8px">📥 从数据胶囊恢复</button>
  </div>
  <div class="settings-section">
    <h3>📊 数据</h3>
    <button class="settings-btn orange" onclick="exportData()">📤 导出 JSON</button>
    <button class="settings-btn red" onclick="clearAllData()" style="margin-top:8px">🗑️ 清空所有数据</button>
  </div>
  <button class="settings-btn orange" onclick="showView('homeView')" style="margin-top:4px">← 返回主页</button>
</div>

<div class="toast" id="toast"></div>

<script>
// ================= 状态 =================
var records = [];
var settings = {};
var flow = null; // { step, plate, customer, items: [{part,cost,shipping,finalPrice}], pendingItem, tempInput }
var voiceSupported = !!(window.SpeechRecognition || window.webkitSpeechRecognition);

// ================= 初始化 =================
function init() {
  loadSettings();
  loadRecords();
  renderHome();
  // 首页自动播报
  setTimeout(function() {
    speak("师傅, 你好。按下面的开始记账按钮, 拍照或者说话, 不用写字。");
  }, 800);
}

// ================= 数据层 (与 v1 兼容) =================
function loadRecords() {
  try { var d = localStorage.getItem("garage_records"); records = d ? JSON.parse(d) : []; }
  catch(e) { records = []; }
}
function saveRecords() {
  try { localStorage.setItem("garage_records", JSON.stringify(records)); } catch(e) {}
}
function loadSettings() {
  try { var d = localStorage.getItem("garage_settings"); settings = d ? JSON.parse(d) : {}; }
  catch(e) { settings = {}; }
  if (!settings.shopName) settings.shopName = "";
  if (!settings.shopAddr) settings.shopAddr = "";
  if (!settings.shopPhone) settings.shopPhone = "";
  syncSettingsForm();
}
function saveSettings() {
  settings.shopName = document.getElementById("setShopName").value.trim();
  settings.shopAddr = document.getElementById("setShopAddr").value.trim();
  settings.shopPhone = document.getElementById("setShopPhone").value.trim();
  settings.webdavUrl = document.getElementById("setWebdavUrl").value.trim();
  settings.webdavUser = document.getElementById("setWebdavUser").value.trim();
  // Storing the WebDAV password in localStorage is a known weak spot; any script
  // that reaches this page can read it. Kept only because the alternative is the
  // user re-typing it on a phone he cannot read, which means he would never back
  // up at all. Revisit once the Worker holds the credential instead.
  settings.webdavPass = document.getElementById("setWebdavPass").value;
  try { localStorage.setItem("garage_settings", JSON.stringify(settings)); } catch(e) {}
}
function syncSettingsForm() {
  document.getElementById("setShopName").value = settings.shopName || "";
  document.getElementById("setShopAddr").value = settings.shopAddr || "";
  document.getElementById("setShopPhone").value = settings.shopPhone || "";
  document.getElementById("setWebdavUrl").value = settings.webdavUrl || "";
  document.getElementById("setWebdavUser").value = settings.webdavUser || "";
  document.getElementById("setWebdavPass").value = settings.webdavPass || "";
}

// Settings were previously never persisted — saveSettings() had no call site.
document.addEventListener("input", function(e) {
  if (e.target && typeof e.target.id === "string" && e.target.id.indexOf("set") === 0) saveSettings();
});

// ================= 视图切换 =================
function showView(viewId) {
  var views = document.querySelectorAll(".view");
  for (var i = 0; i < views.length; i++) views[i].classList.remove("active");
  document.getElementById(viewId).classList.add("active");
  if (viewId === "homeView") renderHome();
  if (viewId === "historyView") renderHistory();
  if (viewId === "settingsView") syncSettingsForm();
}

// ================= 首页 =================
// The home screen is the owner's own private view, so profit belongs here.
// Only the customer-facing receipt must hide cost and profit.
function renderHome() {
  var today = todayStr();
  var count = 0, income = 0, profit = 0;
  for (var i = 0; i < records.length; i++) {
    if (records[i].date === today) {
      count++;
      income += records[i].totalIncome || 0;
      profit += (records[i].totalIncome || 0) - (records[i].totalCost || 0);
    }
  }
  document.getElementById("todayCount").textContent = count + " 单";
  document.getElementById("todayIncome").textContent = "¥" + income;
  document.getElementById("todayProfit").textContent = "¥" + profit;
}

// ================= 记账流程 =================
function startFlow() {
  flow = { step: "plate", plate: "", customer: "", items: [], tempInput: "" };
  showView("guideView");
  renderGuide();
}

function renderGuide() {
  var q = document.getElementById("guideQuestion");
  var hint = document.getElementById("guideHint");
  var body = document.getElementById("guideBody");
  var actions = document.getElementById("guideActions");

  if (flow.step === "plate") {
    q.textContent = "🚗 这辆车什么牌照?";
    hint.textContent = "按下面的大框, 点键盘上的小话筒说话; 有车牌照片就按拍照";
    body.innerHTML = '<div class="big-input-wrap"><input class="big-input" id="guideInput" type="text" placeholder="点这里, 说车牌" inputmode="text"></div>';
    actions.innerHTML = '<button class="big-btn orange" onclick="capturePhoto()">📷 拍车牌</button>' +
      '<button class="big-btn green" onclick="confirmPlate()">✅ 说好了</button>';
    focusGuideInput();
    speak("这辆车什么牌照? 按下面的大框, 点键盘上的小话筒, 说话。或者按右边拍照, 拍车牌。");
  } else if (flow.step === "part") {
    q.textContent = "🔧 进了什么配件? 多少钱?";
    hint.textContent = "比如: 排气歧管垫片, 60, 运费12。没有进货单就说话, 有单子就拍照";
    body.innerHTML = '<div class="big-input-wrap"><input class="big-input" id="guideInput" type="text" placeholder="点这里, 说配件和钱" inputmode="text"></div>';
    actions.innerHTML = '<button class="big-btn orange" onclick="capturePhoto()">📷 拍进货单</button>' +
      '<button class="big-btn green" onclick="confirmPart()">✅ 说好了</button>';
    focusGuideInput();
    speak("进了什么配件? 多少钱? 比如: 排气歧管垫片, 六十, 运费十二。有进货单, 就拍照。");
  } else if (flow.step === "partConfirm") {
    var it = flow.pendingItem;
    q.textContent = "确认一下: " + (it.part || "配件") + ", 成本 " + it.cost + " 元" + (it.shipping > 0 ? ", 运费 " + it.shipping + " 元" : "");
    hint.textContent = "对不对? 对就按绿的, 不对按红的重新说";
    body.innerHTML = '<div class="part-box"><div class="pb-row"><span class="l">配件</span><span class="v">' + escHtml(it.part || "未命名") + '</span></div>' +
      '<div class="pb-row"><span class="l">成本</span><span class="v">¥' + it.cost + '</span></div>' +
      (it.shipping > 0 ? '<div class="pb-row"><span class="l">运费</span><span class="v">¥' + it.shipping + '</span></div>' : "") +
      '</div>';
    actions.innerHTML = '<button class="big-btn red" onclick="redoPart()">🔁 重新说</button>' +
      '<button class="big-btn green" onclick="acceptPart()">✅ 对</button>';
    speak((it.part || "配件") + ", 成本" + it.cost + "元" + (it.shipping > 0 ? ", 运费" + it.shipping + "元" : "") + "。对不对? 对按绿色, 不对按红色重新说。");
  } else if (flow.step === "askMore") {
    q.textContent = "还要加配件吗?";
    hint.textContent = "还有就按绿的, 记完了按橙的算钱";
    body.innerHTML = '<div class="part-box"><div class="pb-title">已经记下 ' + flow.items.length + ' 项</div>' +
      flow.items.map(function(x) {
        return '<div class="pb-row"><span class="l">' + escHtml(x.part) + '</span><span class="v">¥' + (x.cost + x.shipping) + '</span></div>';
      }).join("") + '</div>';
    actions.innerHTML = '<button class="big-btn green" onclick="addAnotherPart()">➕ 还有配件</button>' +
      '<button class="big-btn orange" onclick="goToPrice()">💰 记完了, 算钱</button>';
    speak("已经记下" + flow.items.length + "项。还要加配件, 按绿色。记完了, 按橙色算钱。");
  } else if (flow.step === "price") {
    var totalCost = 0;
    for (var i = 0; i < flow.items.length; i++) totalCost += flow.items[i].cost + flow.items[i].shipping;
    q.textContent = "💰 这单成本 " + totalCost + " 元, 收了多少钱?";
    hint.textContent = "点大框, 说你收的数, 比如一百二";
    body.innerHTML = '<div class="big-input-wrap"><input class="big-input" id="guideInput" type="tel" placeholder="点这里说个数, 如120" inputmode="decimal"></div>';
    actions.innerHTML = '<button class="big-btn green" onclick="confirmPrice()">✅ 说好了</button>';
    focusGuideInput();
    speak("这单成本" + totalCost + "元。收了多少钱? 点大框, 说你收的数, 比如一百二。");
  } else if (flow.step === "priceConfirm") {
    q.textContent = "确认: 实收 " + flow.tempInput + " 元?";
    hint.textContent = "对就按绿色";
    body.innerHTML = '<div class="part-box"><div class="pb-row"><span class="l">实收</span><span class="v" style="font-size:32px;color:#43a047">¥' + flow.tempInput + '</span></div></div>';
    actions.innerHTML = '<button class="big-btn red" onclick="redoPrice()">🔁 重新说</button>' +
      '<button class="big-btn green" onclick="acceptPrice()">✅ 对</button>';
    speak("实收" + flow.tempInput + "元, 对不对?");
  }
}

function focusGuideInput() {
  setTimeout(function() {
    var el = document.getElementById("guideInput");
    if (el) {
      el.focus();
      // 尝试拉起输入法
      el.click();
    }
  }, 300);
}

// 拍照 (暂时提示, OCR 后续接入)
function capturePhoto() {
  toast("📷 拍照识别即将支持。现在请用说话: 点大框, 键盘上的小话筒");
  speak("拍照识别马上就好。现在先用说话, 点大框, 点键盘上的小话筒。");
  focusGuideInput();
}

// ===== 车牌 =====
// All 31 mainland province abbreviations. The old code hardcoded 粤, which is
// the wrong province for this shop — every plate here starts with 皖.
var PLATE_PROVINCES = "京津冀晋蒙辽吉黑沪苏浙皖闽赣鲁豫鄂湘粤桂琼渝川贵云藏陕甘青宁新";

function normalizePlate(raw) {
  var s = normalizeText(raw)
    .replace(/车牌|牌照|号码/g, "")
    .replace(/\s+/g, "")
    .toUpperCase();
  var m = s.match(new RegExp("[" + PLATE_PROVINCES + "]"));
  if (m) {
    var tail = s.slice(s.indexOf(m[0]) + 1)
      // Only repair the tail: ASR hears O for 0 and I for 1 in the serial part.
      .replace(/O/g, "0").replace(/I/g, "1")
      .replace(/[^A-Z0-9]/g, "");
    return m[0] + tail;
  }
  return s.replace(/[^A-Z0-9]/g, "");
}

function confirmPlate() {
  var el = document.getElementById("guideInput");
  var val = (el && el.value) ? el.value.trim() : "";
  if (!val) { toast("请先说车牌"); speak("请先说车牌。"); return; }
  flow.plate = normalizePlate(val);
  if (!flow.plate) { toast("没听清车牌, 再说一次"); speak("没听清车牌, 再说一次。"); return; }
  flow.step = "part";
  // Read the digits back one at a time so he can check them by ear.
  speak("车牌" + flow.plate.split("").join(" ") + ", 对不对? 对就接着说配件。");
  renderGuide();
}

// ===== 配件 =====
function confirmPart() {
  var el = document.getElementById("guideInput");
  var val = (el && el.value) ? el.value.trim() : "";
  if (!val) { toast("请说配件和价格"); speak("请说配件和价格。"); return; }
  flow.pendingItem = parsePartText(val);
  if (!flow.pendingItem.cost && !flow.pendingItem.part) {
    toast("没听清, 再说一次: 配件名, 价格");
    speak("没听清, 再说一次。比如说: 排气歧管垫片, 六十。");
    return;
  }
  flow.step = "partConfirm";
  renderGuide();
}

// Normalize what the IME actually produces: full-width digits/letters, a space
// inserted before amounts, a trailing full-width period, currency signs.
function normalizeText(raw) {
  return String(raw || "")
    .replace(/[０-９Ａ-Ｚａ-ｚ]/g, function(c) {
      return String.fromCharCode(c.charCodeAt(0) - 0xFEE0);
    })
    .replace(/[，。、；！？（）]/g, " ")
    .replace(/[¥￥$]/g, " ")
    .replace(/\s+/g, " ")
    .trim();
}

// Spoken Chinese numbers. The father says "六十" and "一百二", never "60".
var CN_DIGITS = { "零":0, "一":1, "二":2, "两":2, "三":3, "四":4, "五":5, "六":6, "七":7, "八":8, "九":9 };
var CN_UNITS = { "十":10, "百":100, "千":1000, "万":10000 };
var CN_NUM_CLASS = "[零一二两三四五六七八九十百千万]";

function cnToNumber(s) {
  if (!s) return NaN;
  if (/^\d+(\.\d+)?$/.test(s)) return parseFloat(s);
  if (!new RegExp("^" + CN_NUM_CLASS + "+$").test(s)) return NaN;

  var total = 0, section = 0, digit = 0, sawDigit = false;
  var lastUnit = 0, sawUnit = false, sawZero = false;
  for (var i = 0; i < s.length; i++) {
    var ch = s.charAt(i);
    if (CN_DIGITS[ch] !== undefined) {
      digit = CN_DIGITS[ch];
      sawDigit = true;
      if (ch === "零") sawZero = true;
    } else if (CN_UNITS[ch]) {
      var unit = CN_UNITS[ch];
      sawUnit = true;
      lastUnit = unit;
      if (unit === 10000) {
        section = (section + digit) * unit;
        total += section;
        section = 0;
      } else {
        section += (sawDigit ? digit : 1) * unit;
      }
      digit = 0;
      sawDigit = false;
    }
  }

  // A digit left over after a unit is the spoken shorthand where the next unit
  // down is implied: 一百二 = 120, 两千五 = 2500. But an explicit 零 marks the
  // skipped place, so 一百零五 is 105 — scaling it up would turn it into 150.
  if (sawDigit && digit >= 0) {
    if (sawUnit && lastUnit >= 100 && !sawZero) {
      total += section + digit * (lastUnit / 10);
    } else {
      total += section + digit;
    }
  } else {
    total += section;
  }
  return total;
}

var NUM_TOKEN = "(\\d+(?:\\.\\d+)?|" + CN_NUM_CLASS + "+)";

// Counting words. "刹车片两个一共80" — 两 is a count, 80 is the money.
// 块 is deliberately absent: it is also the spoken word for yuan ("十五块"),
// and reading money as a count would silently lose the cost.
var COUNT_UNITS = "个只条根套支瓶桶升副对片张台盒包";

/**
 * Pull the part name and the money out of one spoken line.
 *
 * The name is kept EXACTLY as heard, even when the ASR garbles it ("漆管片"),
 * because that string is what gets read back aloud — a garbled name he
 * recognizes by sound is useful, a "corrected" name he never said is not.
 * Losing the numbers, on the other hand, corrupts the ledger. Numbers first.
 *
 * The subtle trap is a numeral that is part of the NAME: 三元催化器, 四轮定位,
 * 二保焊丝, 三滤. Reading that 三 as the price turns an 800 yuan part into 3
 * yuan — wrong money, silently, which is far worse than failing to parse.
 * So a Chinese numeral only counts as money when it stands alone as a token.
 */
function parsePartText(txt) {
  var s = normalizeText(txt);
  var shipping = 0, cost = 0;

  var shipRe = new RegExp("(?:运费|邮费|快递费)\\s*[:：]?\\s*" + NUM_TOKEN);
  var sm = s.match(shipRe);
  if (sm) {
    var shipVal = cnToNumber(sm[1]);
    if (!isNaN(shipVal)) shipping = shipVal;
    s = s.replace(sm[0], " ");
  }

  var costRe = new RegExp("(?:成本|进价|本钱|拿货|买[来的]?)\\s*[:：]?\\s*" + NUM_TOKEN);
  var cm = s.match(costRe);
  var rest = s;
  if (cm) {
    // An explicit keyword is unambiguous — trust it.
    var costVal = cnToNumber(cm[1]);
    if (!isNaN(costVal)) cost = costVal;
    rest = s.replace(cm[0], " ");
  } else {
    var best = null;
    // Arabic digits are always money: he types them only for amounts.
    var digitRe = /\d+(?:\.\d+)?/g;
    var m;
    while ((m = digitRe.exec(s)) !== null) {
      var dv = parseFloat(m[0]);
      if (!isNaN(dv) && (best === null || dv > best.value)) {
        best = { value: dv, index: m.index, length: m[0].length };
      }
    }
    if (best === null) {
      // Only Chinese numerals left. Accept one only if it is a separate token,
      // i.e. not glued to surrounding name characters, and not a bare count
      // like "两个". This is what keeps 三元催化器 from becoming 3 yuan.
      var cnRe = new RegExp(CN_NUM_CLASS + "+", "g");
      while ((m = cnRe.exec(s)) !== null) {
        var before = m.index > 0 ? s.charAt(m.index - 1) : " ";
        var afterIdx = m.index + m[0].length;
        var after = afterIdx < s.length ? s.charAt(afterIdx) : " ";
        var standalone = (before === " ") && (after === " " || "元块钱".indexOf(after) >= 0);
        if (!standalone) continue;
        if (COUNT_UNITS.indexOf(after) >= 0) continue;
        var v = cnToNumber(m[0]);
        if (isNaN(v)) continue;
        if (best === null || v > best.value) {
          best = { value: v, index: m.index, length: m[0].length };
        }
      }
    }
    if (best !== null) {
      cost = best.value;
      // Swallow a currency word that directly followed the amount, so it does
      // not end up glued onto the name ("皮带 十五块" → "皮带块"). Anchoring on
      // adjacency keeps names that genuinely end in 块/元 intact ("刹车块").
      var end = best.index + best.length;
      while (end < s.length && "元块钱".indexOf(s.charAt(end)) >= 0) end++;
      rest = s.slice(0, best.index) + " " + s.slice(end);
    }
  }

  // Whatever text is left is the name. Only strip the money token that was
  // consumed above plus bookkeeping words — a numeral belonging to the name
  // must survive, or "三元催化器" comes back as "元催化器".
  var part = rest
    .replace(/\d+(?:\.\d+)?/g, " ")
    .replace(/(?:运费|邮费|快递费|成本|进价|本钱|拿货|买来|买的|元钱|块钱)/g, " ")
    .replace(/[,\s]+/g, "")
    .trim();
  if (!part) part = "配件";

  // Never let NaN reach storage: it serializes to null and corrupts the ledger.
  if (isNaN(cost)) cost = 0;
  if (isNaN(shipping)) shipping = 0;
  return { part: part, cost: cost, shipping: shipping };
}

function redoPart() {
  flow.step = "part";
  renderGuide();
}

function acceptPart() {
  flow.items.push(flow.pendingItem);
  flow.pendingItem = null;
  // Native confirm() is a text-only modal with tiny buttons — unusable for a
  // user who cannot read. Ask with a full guide screen instead.
  flow.step = "askMore";
  renderGuide();
}

function addAnotherPart() {
  flow.step = "part";
  renderGuide();
}

function goToPrice() {
  flow.step = "price";
  renderGuide();
}

// ===== 价格 =====
function confirmPrice() {
  var el = document.getElementById("guideInput");
  var val = (el && el.value) ? el.value.trim() : "";
  var amount = NaN;
  var norm = normalizeText(val);
  var m = norm.match(new RegExp(NUM_TOKEN));
  if (m) amount = cnToNumber(m[1]);
  if (isNaN(amount)) { toast("请说个数, 比如120"); speak("请说个数, 比如一百二十。"); return; }
  flow.tempInput = amount;
  flow.step = "priceConfirm";
  renderGuide();
}

function redoPrice() {
  flow.step = "price";
  renderGuide();
}

function acceptPrice() {
  var totalCost = 0;
  for (var i = 0; i < flow.items.length; i++) totalCost += flow.items[i].cost + flow.items[i].shipping;
  var income = parseFloat(flow.tempInput);
  if (isNaN(income)) income = totalCost;

  // Spread what he charged across the items in proportion to their cost, so the
  // per-line figures still add up to the single number he actually said.
  // A labour-only job has zero cost, so split evenly rather than dividing by 0.
  var items = [];
  var assigned = 0;
  for (var i = 0; i < flow.items.length; i++) {
    var it = flow.items[i];
    var lineCost = it.cost + it.shipping;
    var share;
    if (i === flow.items.length - 1) {
      share = income - assigned;
    } else if (totalCost > 0) {
      share = Math.round(lineCost / totalCost * income * 100) / 100;
    } else {
      share = Math.round(income / flow.items.length * 100) / 100;
    }
    assigned += share;
    items.push({
      part: it.part,
      cost: it.cost,
      shipping: it.shipping,
      totalCost: lineCost,
      finalPrice: Math.round(share * 100) / 100
    });
  }
  var record = {
    id: Date.now().toString() + "_" + Math.random().toString(36).slice(2,6),
    date: todayStr(),
    plate: flow.plate,
    customer: flow.customer || "",
    items: items,
    totalCost: Math.round(totalCost * 100) / 100,
    totalIncome: income,
    createdAt: new Date().toISOString(),
    receiptNo: genReceiptNo()
  };
  records.push(record);
  saveRecords();
  flow.currentRecord = record;
  renderReceipt(record);
}

/**
 * Sequential per-day receipt number.
 *
 * Derived from the highest number already used today, not from the record count:
 * counting would reissue a number after a deletion, and two jobs sharing a
 * receipt number is the kind of thing that loses an argument with a customer.
 */
function genReceiptNo() {
  var pad = function(n, l) { n = String(n); while (n.length < l) n = "0" + n; return n; };
  var dateStr = todayStr().replace(/-/g, "");
  var prefix = "GX" + dateStr + "-";
  var max = 0;
  for (var i = 0; i < records.length; i++) {
    var no = records[i].receiptNo;
    if (no && no.indexOf(prefix) === 0) {
      var seq = parseInt(no.slice(prefix.length), 10);
      if (!isNaN(seq) && seq > max) max = seq;
    }
  }
  return prefix + pad(max + 1, 3);
}

// ================= 收据 =================
/**
 * The customer settlement sheet.
 *
 * PRODUCT CONTRACT: this sheet is handed to the customer, so it must never
 * show cost, shipping, or profit — only what he is being charged. The private
 * ledger lives on the home and history screens.
 */
function renderReceipt(record) {
  var r = record;
  var itemsHtml = "";
  for (var i = 0; i < r.items.length; i++) {
    var it = r.items[i];
    itemsHtml += "<tr><td>" + (i+1) + "</td><td style=\"text-align:left\">" + escHtml(it.part) + "</td><td>1</td><td>" + fmt(it.finalPrice) + "</td></tr>";
  }
  document.getElementById("receiptPage").innerHTML =
    '<div class="rp-title">维修结算单</div>' +
    (settings.shopName ? '<div class="rp-shop">' + escHtml(settings.shopName) + '</div>' : "") +
    '<div class="rp-meta"><span>单号: ' + (r.receiptNo || "") + '</span><span>日期: ' + r.date + '</span></div>' +
    (settings.shopAddr || settings.shopPhone ? '<div class="rp-contact">' + escHtml(settings.shopAddr || "") + (settings.shopAddr && settings.shopPhone ? "　" : "") + escHtml(settings.shopPhone || "") + '</div>' : "") +
    '<div class="rp-meta" style="margin-top:6px"><span>车牌: ' + escHtml(r.plate) + '</span>' + (r.customer ? '<span>客户: ' + escHtml(r.customer) + '</span>' : "") + '</div>' +
    '<table class="rp-items"><tr><th>序号</th><th>项目名称</th><th>数量</th><th>金额(元)</th></tr>' + itemsHtml + '</table>' +
    '<div class="rp-total"><span>应收金额</span><span class="big">¥' + fmt(r.totalIncome) + '</span></div>' +
    '<div class="rp-total"><span>大写金额</span><span>' + toChinese(r.totalIncome) + '</span></div>' +
    '<div class="rp-note">备注: </div>' +
    '<div class="rp-sign"><span>经办人: ________</span><span>客户签字: ________</span></div>' +
    '<div class="rp-foot">本单为维修记录凭证, 非正式发票 · 汽修记账助手</div>';
  showView("receiptView");
  // Announced while the customer may be within earshot, so this says only what
  // is on the sheet — no cost, no profit.
  speak("记好了。车牌" + r.plate + ", 共" + r.items.length + "项, 收" + r.totalIncome + "元。收据已经生成, 可以保存图片。");
}

function finishRecord() {
  flow = null;
  showView("homeView");
  speak("记好了。还要记账, 再按开始记账。");
}

/**
 * Render the receipt to a PNG using only built-in browser APIs.
 *
 * Deliberately not html2canvas from a CDN: the phone is often offline in the
 * workshop, and jsDelivr is unreliable in China, so a runtime download meant
 * the button simply failed when it was needed. SVG foreignObject ships nothing.
 */
function saveReceiptImage() {
  var page = document.getElementById("receiptPage");
  var record = flow && flow.currentRecord ? flow.currentRecord : null;
  var name = "收据_" + (record ? record.receiptNo : todayStr()) + ".png";
  var width = page.offsetWidth || 360;
  var height = page.scrollHeight || 640;

  try {
    var clone = page.cloneNode(true);
    clone.setAttribute("xmlns", "http://www.w3.org/1999/xhtml");
    clone.style.width = width + "px";
    clone.style.background = "#fff";
    clone.style.color = "#000";
    clone.style.fontFamily = "serif";

    var svg = '<svg xmlns="http://www.w3.org/2000/svg" width="' + width + '" height="' + height + '">' +
      '<foreignObject width="100%" height="100%">' +
      new XMLSerializer().serializeToString(clone) +
      '</foreignObject></svg>';

    var img = new Image();
    var svgUrl = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
    img.onload = function() {
      var canvas = document.createElement("canvas");
      var scale = 2;
      canvas.width = width * scale;
      canvas.height = height * scale;
      var ctx = canvas.getContext("2d");
      ctx.fillStyle = "#fff";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.scale(scale, scale);
      ctx.drawImage(img, 0, 0);
      canvas.toBlob(function(blob) {
        if (!blob) {
          toast("⚠️ 保存失败, 请截屏代替");
          speak("保存失败, 请用手机截屏发给客户。");
          return;
        }
        var url = URL.createObjectURL(blob);
        var a = document.createElement("a");
        a.href = url;
        a.download = name;
        a.click();
        setTimeout(function() { URL.revokeObjectURL(url); }, 4000);
        toast("✅ 收据已保存, 可以发给客户");
        speak("收据已经保存, 可以发给客户。");
      }, "image/png");
    };
    img.onerror = function() {
      toast("⚠️ 保存失败, 请用手机截屏发给客户");
      speak("保存失败, 请用手机截屏发给客户。");
    };
    img.src = svgUrl;
  } catch (e) {
    toast("⚠️ 保存失败, 请用手机截屏");
    speak("保存失败, 请用手机截屏发给客户。");
  }
}

// ================= 工具 =================
function escHtml(s) {
  var d = document.createElement("div");
  d.textContent = s || "";
  return d.innerHTML;
}
function fmt(n) {
  n = parseFloat(n) || 0;
  return n.toFixed(2);
}
function toChinese(n) {
  n = Math.round((parseFloat(n) || 0) * 100) / 100;
  if (n === 0) return "零元整";
  var digits = "零壹贰叁肆伍陆柒捌玖";
  var units = ["", "拾", "佰", "仟"];
  var bigUnits = ["", "万", "亿", "万亿"];
  var intPart = Math.floor(n);
  var decPart = Math.round((n - intPart) * 100);
  var groups = [];
  while (intPart > 0) {
    groups.push(intPart % 10000);
    intPart = Math.floor(intPart / 10000);
  }
  // groups[0]=个位组, groups[1]=万位组...
  var result = "";
  for (var i = groups.length - 1; i >= 0; i--) {
    var g = groups[i];
    if (g === 0) {
      // 本组全零: 如果之前已有输出且后面还有非零组, 补一个零
      if (result !== "") {
        var hasLater = false;
        for (var j = i - 1; j >= 0; j--) {
          if (groups[j] > 0) { hasLater = true; break; }
        }
        if (hasLater && result.charAt(result.length - 1) !== "零") result += "零";
      }
      continue;
    }
    var seg = "";
    var q = Math.floor(g / 1000);
    var b = Math.floor((g % 1000) / 100);
    var s = Math.floor((g % 100) / 10);
    var ge = g % 10;
    if (q > 0) {
      seg += digits[q] + "仟";
    } else if (result !== "" && (b > 0 || s > 0 || ge > 0)) {
      seg += "零";  // 跨组补零
    }
    if (b > 0) {
      seg += digits[b] + "佰";
    } else if ((q > 0 || (result !== "" && g > 0)) && (s > 0 || ge > 0)) {
      if (seg.charAt(seg.length - 1) !== "零") seg += "零";
    }
    if (s > 0) {
      seg += digits[s] + "拾";
    } else if ((q > 0 || b > 0 || (result !== "" && g > 0)) && ge > 0) {
      if (seg.charAt(seg.length - 1) !== "零") seg += "零";
    }
    if (ge > 0) seg += digits[ge];
    result += seg + (bigUnits[i] || "");
  }
  result += "元";
  var jiao = Math.floor(decPart / 10), fen = decPart % 10;
  if (jiao > 0) result += digits[jiao] + "角";
  if (fen > 0) result += digits[fen] + "分";
  if (jiao === 0 && fen === 0) result += "整";
  return result;
}

// ================= Toast =================
function toast(msg) {
  var el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(el._timer);
  el._timer = setTimeout(function() { el.classList.remove("show"); }, 3000);
}

/**
 * Local calendar date as YYYY-MM-DD.
 *
 * Not toISOString(): that is UTC, so a job finished at 00:30 Beijing time would
 * be filed under the previous day and quietly land in yesterday's takings.
 */
function todayStr(d) {
  d = d || new Date();
  var pad = function(n) { return (n < 10 ? "0" : "") + n; };
  return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
}

// ================= 朗读 =================
// Every number this user "reads" he actually hears, so speak() is load-bearing
// rather than an accessibility extra.
function speak(text) {
  if (!text) return;
  if (!window.speechSynthesis) return;
  try {
    window.speechSynthesis.cancel();
    var utter = new SpeechSynthesisUtterance(String(text));
    utter.lang = "zh-CN";
    utter.rate = 0.85;   // slower than default: he is listening for digits
    utter.pitch = 1;
    var voices = window.speechSynthesis.getVoices() || [];
    for (var i = 0; i < voices.length; i++) {
      if (voices[i].lang && voices[i].lang.indexOf("zh") === 0) { utter.voice = voices[i]; break; }
    }
    var ind = document.getElementById("speakIndicator");
    if (ind) {
      ind.classList.add("on");
      utter.onend = function() { ind.classList.remove("on"); };
      utter.onerror = function() { ind.classList.remove("on"); };
    }
    window.speechSynthesis.speak(utter);
  } catch (e) { /* TTS is best-effort; never break the flow over it */ }
}

// ================= 历史账目 =================
function renderHistory() {
  var container = document.getElementById("historyList");
  if (!records.length) {
    container.innerHTML = '<div style="text-align:center;padding:60px 20px;color:var(--text2);font-size:20px;line-height:2">' +
      '<span style="font-size:64px;display:block;margin-bottom:16px">📋</span>还没有账目<br>回主页按「开始记账」</div>';
    return;
  }
  var sorted = records.slice().sort(function(a, b) {
    if (a.date !== b.date) return a.date < b.date ? 1 : -1;
    return (a.createdAt || "") < (b.createdAt || "") ? 1 : -1;
  });
  var html = "";
  for (var i = 0; i < sorted.length; i++) {
    var r = sorted[i];
    var profit = (r.totalIncome || 0) - (r.totalCost || 0);
    html += '<div class="hist-card" onclick="speakRecord(\'' + r.id + '\')">' +
      '<div class="hc-top"><span class="hc-plate">' + escHtml(r.plate) + '</span><span>¥' + (r.totalIncome || 0) + '</span></div>' +
      '<div class="hc-sum"><span>' + r.date + ' · ' + (r.items || []).length + ' 项</span>' +
      '<span>成本 ¥' + (r.totalCost || 0) + ' · 赚 ¥' + profit + '</span></div></div>';
  }
  container.innerHTML = html;
}

// Tapping a history row reads it aloud — the only way he can review the ledger.
function speakRecord(id) {
  var r = null;
  for (var i = 0; i < records.length; i++) if (records[i].id === id) { r = records[i]; break; }
  if (!r) return;
  var parts = (r.items || []).map(function(it) { return it.part; }).join(", ");
  var profit = (r.totalIncome || 0) - (r.totalCost || 0);
  speak(r.date + ", 车牌" + r.plate + ", " + parts + ", 成本" + (r.totalCost || 0) +
        "元, 收了" + (r.totalIncome || 0) + "元, 赚" + profit + "元。");
}

// ================= 数据导出 / 清空 =================
function exportData() {
  try {
    var payload = JSON.stringify({ records: records, settings: settings, exportedAt: new Date().toISOString() }, null, 2);
    var blob = new Blob([payload], { type: "application/json" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = "garage_backup_" + todayStr() + ".json";
    a.click();
    setTimeout(function() { URL.revokeObjectURL(url); }, 4000);
    toast("📤 已导出 " + records.length + " 条");
    speak("已经导出" + records.length + "条账目。");
  } catch (e) {
    toast("导出失败: " + e.message);
    speak("导出失败了。");
  }
}

// Destructive, and he cannot read a warning dialog — so it is spoken, and it
// requires a second deliberate press within a few seconds.
var clearArmed = 0;
function clearAllData() {
  var now = Date.now();
  if (now - clearArmed > 6000) {
    clearArmed = now;
    toast("⚠️ 真的要全部删掉? 再按一次确认");
    speak("注意, 这会删掉全部账目, 删了找不回来。真的要删, 就再按一次。不删就别动。");
    return;
  }
  clearArmed = 0;
  records = [];
  saveRecords();
  toast("🗑️ 已清空");
  speak("全部账目已经删掉了。");
  showView("homeView");
}

// ================= WebDAV 备份 =================
function webdavConfig() {
  var url = (settings.webdavUrl || "").trim();
  var user = (settings.webdavUser || "").trim();
  var pass = settings.webdavPass || "";
  if (!url) { toast("⚠️ 请先填 WebDAV 地址"); speak("还没设置备份地址。"); return null; }
  if (!user || !pass) { toast("⚠️ 请填用户名和密码"); speak("还没设置备份的用户名和密码。"); return null; }
  if (url.charAt(url.length - 1) !== "/") url += "/";
  return { url: url, auth: "Basic " + btoa(unescape(encodeURIComponent(user + ":" + pass))) };
}

function backupToWebdav() {
  var cfg = webdavConfig();
  if (!cfg) return;
  var filename = "garage_backup_" + todayStr() + ".json";
  toast("☁️ 正在备份...");
  speak("正在备份。");
  fetch(cfg.url + filename, {
    method: "PUT",
    headers: { "Authorization": cfg.auth, "Content-Type": "application/json" },
    body: JSON.stringify({ records: records, settings: settings, exportedAt: new Date().toISOString() })
  }).then(function(res) {
    if (res.ok || res.status === 201 || res.status === 204) {
      toast("✅ 备份成功 (" + records.length + " 条)");
      speak("备份成功, 一共" + records.length + "条账目。");
    } else {
      toast("❌ 备份失败: HTTP " + res.status);
      speak("备份失败了, 检查一下网络。");
    }
  }).catch(function(err) {
    toast("❌ 备份失败: " + err.message);
    speak("备份失败了, 检查一下网络。");
  });
}

function restoreFromWebdav() {
  var cfg = webdavConfig();
  if (!cfg) return;
  toast("📥 正在找备份...");
  speak("正在找备份。");
  fetch(cfg.url, { method: "PROPFIND", headers: { "Authorization": cfg.auth, "Depth": "1" } })
    .then(function(res) {
      if (!res.ok) throw new Error("HTTP " + res.status);
      return res.text();
    })
    .then(function(xml) {
      var doc = new DOMParser().parseFromString(xml, "text/xml");
      // Namespace prefixes vary between WebDAV servers, so match on local name.
      var nodes = doc.getElementsByTagName("*");
      var files = [];
      for (var i = 0; i < nodes.length; i++) {
        var n = nodes[i];
        var local = n.localName || n.nodeName.replace(/^.*:/, "");
        if (local.toLowerCase() !== "href") continue;
        var t = (n.textContent || "").trim();
        if (t.indexOf("garage_backup") >= 0 && t.indexOf(".json") >= 0) {
          files.push(t.slice(t.lastIndexOf("/") + 1));
        }
      }
      if (!files.length) throw new Error("没找到备份文件");
      files.sort().reverse();
      return fetch(cfg.url + files[0], { headers: { "Authorization": cfg.auth } });
    })
    .then(function(r) {
      if (!r.ok) throw new Error("读取失败");
      return r.json();
    })
    .then(function(data) {
      if (!data || !Array.isArray(data.records)) throw new Error("备份文件格式不对");
      records = data.records;
      if (data.settings) {
        // Keep this device's own WebDAV credentials rather than importing them.
        var keep = { webdavUrl: settings.webdavUrl, webdavUser: settings.webdavUser, webdavPass: settings.webdavPass };
        settings = data.settings;
        settings.webdavUrl = keep.webdavUrl;
        settings.webdavUser = keep.webdavUser;
        settings.webdavPass = keep.webdavPass;
        try { localStorage.setItem("garage_settings", JSON.stringify(settings)); } catch (e) {}
        syncSettingsForm();
      }
      saveRecords();
      toast("✅ 恢复成功 (" + records.length + " 条)");
      speak("恢复成功, 一共" + records.length + "条账目。");
      showView("homeView");
    })
    .catch(function(err) {
      toast("❌ 恢复失败: " + err.message);
      speak("恢复失败了。");
    });
}

  window.addEventListener("load", function() {
    navigator.serviceWorker.register("sw.js").catch(function() {});
  });
}
