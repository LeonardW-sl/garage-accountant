<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<meta name="theme-color" content="#e65100">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<title>汽修记账助手</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#1a1a2e;--card:#16213e;--card2:#0f3460;--accent:#e65100;--accent2:#ff8f00;--text:#fff;--text2:#aab;--success:#2e7d32;--danger:#c62828;--radius:12px;--shadow:0 2px 12px rgba(0,0,0,.3)}
html,body{height:100%;overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);font-size:18px;line-height:1.5;display:flex;flex-direction:column}
header{background:var(--accent);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;z-index:10;position:sticky;top:0}
header h1{font-size:22px;font-weight:700;letter-spacing:1px}
header button{background:none;border:none;color:#fff;font-size:24px;padding:8px;cursor:pointer;border-radius:50%;width:44px;height:44px;display:flex;align-items:center;justify-content:center}
header button:active{background:rgba(255,255,255,.2)}
.view{display:none;flex-direction:column;flex:1;overflow:hidden}
.view.active{display:flex}
#mainView{padding:12px;gap:8px;overflow-y:auto}
.list-header{display:flex;justify-content:space-between;align-items:center;padding:4px 0 8px;color:var(--text2);font-size:14px;flex-shrink:0}
.record-card{background:var(--card);border-radius:var(--radius);padding:16px;cursor:pointer;box-shadow:var(--shadow);border-left:4px solid var(--accent);transition:background .15s;user-select:none}
.record-card:active{background:var(--card2)}
.record-card .rc-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.record-card .rc-plate{font-size:20px;font-weight:700;color:var(--accent2)}
.record-card .rc-date{font-size:14px;color:var(--text2)}
.record-card .rc-bottom{display:flex;justify-content:space-between;font-size:16px}
.record-card .rc-cost{color:var(--text2)}
.record-card .rc-price{color:#4caf50;font-weight:700}
.empty-state{text-align:center;padding:60px 20px;color:var(--text2);font-size:20px;line-height:2}
.empty-state .big-icon{font-size:64px;margin-bottom:16px;display:block}
.fab{position:fixed;bottom:24px;right:24px;width:64px;height:64px;border-radius:50%;background:var(--accent);color:#fff;border:none;font-size:36px;box-shadow:0 4px 20px rgba(230,81,0,.5);cursor:pointer;z-index:20;display:flex;align-items:center;justify-content:center;transition:transform .15s}
.fab:active{transform:scale(.92)}
#addView{padding:12px;overflow-y:auto}
#addView .form-section{background:var(--card);border-radius:var(--radius);padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
.form-section h3{font-size:16px;color:var(--accent2);margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid rgba(255,255,255,.1)}
.form-group{margin-bottom:14px}
.form-group:last-child{margin-bottom:0}
.form-group label{display:flex;align-items:center;font-size:15px;color:var(--text2);margin-bottom:4px;gap:6px}
.form-group .input-row{display:flex;gap:8px;align-items:center}
.form-group input,.form-group select{flex:1;background:var(--card2);border:1px solid rgba(255,255,255,.1);color:var(--text);padding:12px 14px;border-radius:8px;font-size:18px;outline:none;width:100%}
.form-group input:focus{border-color:var(--accent)}
.form-group input[type=number]{-moz-appearance:textfield}
.form-group input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none}
.mic-btn{background:var(--card2);border:1px solid rgba(255,255,255,.1);color:var(--accent2);width:48px;height:48px;border-radius:8px;font-size:22px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.mic-btn:active{background:var(--accent);color:#fff}
.mic-btn.listening{background:var(--accent);color:#fff;animation:pulse .8s infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
.speak-btn{background:none;border:none;color:var(--accent2);font-size:18px;cursor:pointer;padding:4px 8px;flex-shrink:0}
.speak-btn:active{color:var(--accent)}
.item-card{background:var(--card2);border-radius:8px;padding:12px;margin-bottom:8px;position:relative}
.item-card .item-row{display:flex;gap:8px;margin-bottom:8px;align-items:center}
.item-card .item-row:last-child{margin-bottom:0}
.item-card .item-label{font-size:13px;color:var(--text2);min-width:50px;flex-shrink:0}
.item-card .item-val{flex:1;font-size:16px}
.item-card .item-val.price{color:#4caf50;font-weight:700}
.item-card .item-val.cost{color:var(--text2)}
.item-card .del-item{background:var(--danger);color:#fff;border:none;width:32px;height:32px;border-radius:50%;font-size:16px;cursor:pointer;position:absolute;top:-8px;right:-8px;display:flex;align-items:center;justify-content:center}
.add-item-btn{background:var(--card2);border:1px dashed var(--accent2);color:var(--accent2);padding:12px;border-radius:8px;font-size:16px;cursor:pointer;width:100%;margin-top:8px}
.add-item-btn:active{background:var(--accent);color:#fff}
.form-actions{display:flex;gap:12px;margin-top:4px;padding:4px 0 20px}
.form-actions button{flex:1;padding:14px;border:none;border-radius:8px;font-size:18px;font-weight:700;cursor:pointer}
.form-actions .btn-save{background:var(--accent);color:#fff}
.form-actions .btn-cancel{background:var(--card2);color:var(--text2)}
.form-actions .btn-save:active,.form-actions .btn-cancel:active{opacity:.8}
#detailView{padding:12px;overflow-y:auto}
.detail-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.detail-header h2{font-size:20px;color:var(--accent2)}
.detail-header button{background:var(--card2);border:none;color:var(--text);padding:8px 16px;border-radius:8px;font-size:16px;cursor:pointer}
.detail-summary{background:var(--card);border-radius:var(--radius);padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
.detail-summary .ds-row{display:flex;justify-content:space-between;padding:8px 0;font-size:18px;border-bottom:1px solid rgba(255,255,255,.05)}
.detail-summary .ds-row:last-child{border-bottom:none}
.detail-summary .ds-label{color:var(--text2)}
.detail-summary .ds-value{font-weight:700}
.detail-summary .ds-value.green{color:#4caf50}
.detail-summary .ds-value.red{color:#ef5350}
.detail-items{background:var(--card);border-radius:var(--radius);padding:12px;box-shadow:var(--shadow)}
.detail-item{padding:12px;border-bottom:1px solid rgba(255,255,255,.05);cursor:pointer;border-radius:8px;transition:background .15s}
.detail-item:active{background:var(--card2)}
.detail-item:last-child{border-bottom:none}
.detail-item .di-name{font-size:18px;font-weight:700;color:var(--accent2);margin-bottom:4px}
.detail-item .di-details{font-size:15px;color:var(--text2);display:flex;flex-wrap:wrap;gap:12px}
.detail-item .di-details span{white-space:nowrap}
.detail-item .di-price{color:#4caf50;font-weight:700}
.detail-actions{display:flex;gap:12px;margin-top:16px;padding-bottom:20px}
.detail-actions button{flex:1;padding:14px;border:none;border-radius:8px;font-size:16px;cursor:pointer}
.detail-actions .btn-delete{background:var(--danger);color:#fff}
.detail-actions .btn-back{background:var(--card2);color:var(--text)}
#settingsView{padding:12px;overflow-y:auto}
.settings-section{background:var(--card);border-radius:var(--radius);padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
.settings-section h3{font-size:16px;color:var(--accent2);margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid rgba(255,255,255,.1)}
.setting-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.05)}
.setting-row:last-child{border-bottom:none}
.setting-row label{font-size:15px;color:var(--text2)}
.setting-row input{background:var(--card2);border:1px solid rgba(255,255,255,.1);color:var(--text);padding:8px 12px;border-radius:6px;font-size:16px;width:100px;text-align:center}
.settings-btn{background:var(--card2);border:1px solid var(--accent2);color:var(--accent2);padding:12px;border-radius:8px;font-size:16px;cursor:pointer;width:100%;margin-top:8px}
.settings-btn:active{background:var(--accent);color:#fff}
.settings-btn.danger{border-color:var(--danger);color:var(--danger)}
.settings-btn.danger:active{background:var(--danger);color:#fff}
.settings-btn.success{border-color:var(--success);color:var(--success)}
.settings-btn.success:active{background:var(--success);color:#fff}
#voiceOverlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.85);z-index:100;display:none;flex-direction:column;align-items:center;justify-content:center;padding:40px}
#voiceOverlay.active{display:flex}
.vo-box{background:var(--card);border-radius:var(--radius);padding:40px;text-align:center;max-width:360px;width:100%;box-shadow:0 8px 40px rgba(0,0,0,.5)}
.vo-mic{font-size:64px;margin-bottom:16px;display:block}
.vo-mic.listening{animation:bounce 1s infinite}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
.vo-status{font-size:20px;color:var(--text2);margin-bottom:8px}
.vo-result{font-size:26px;color:var(--accent2);font-weight:700;margin-bottom:24px;min-height:40px;padding:8px;background:var(--card2);border-radius:8px}
.vo-buttons{display:flex;gap:12px}
.vo-buttons button{flex:1;padding:12px;border:none;border-radius:8px;font-size:18px;cursor:pointer}
.vo-confirm{background:var(--accent);color:#fff}
.vo-cancel{background:var(--card2);color:var(--text2)}
.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:var(--card);color:var(--text);padding:12px 24px;border-radius:8px;font-size:16px;box-shadow:0 4px 20px rgba(0,0,0,.5);z-index:200;border-left:4px solid var(--accent);opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--card2);border-radius:2px}
@media(min-width:480px){body{max-width:480px;margin:0 auto;border-left:1px solid rgba(255,255,255,.05);border-right:1px solid rgba(255,255,255,.05)}}
</style>
</head>
<body>
<header>
  <h1 id="headerTitle">🔧 汽修记账</h1>
  <button id="settingsBtn" onclick="showView('settingsView')" aria-label="设置">⚙️</button>
</header>

<div id="mainView" class="view active">
  <div class="list-header">
    <span>📋 最近记录</span>
    <span id="recordCount">0 条</span>
  </div>
  <div id="recordList"></div>
  <button class="fab" onclick="startNewRecord()" aria-label="新增记录">+</button>
</div>

<div id="addView" class="view">
  <div class="form-section">
    <h3>📋 基本信息</h3>
    <div class="form-group">
      <label>📅 日期</label>
      <input type="date" id="recDate">
    </div>
    <div class="form-group">
      <label>🚗 车牌号</label>
      <div class="input-row">
        <input type="text" id="recPlate" placeholder="例如: 粤B12345" inputmode="text">
        <button class="mic-btn" onclick="startVoice('recPlate')" aria-label="语音输入车牌">🎤</button>
      </div>
    </div>
    <div class="form-group">
      <label>👤 客户名</label>
      <div class="input-row">
        <input type="text" id="recCustomer" placeholder="非必填" inputmode="text">
        <button class="mic-btn" onclick="startVoice('recCustomer')" aria-label="语音输入客户名">🎤</button>
      </div>
    </div>
  </div>
  <div class="form-section">
    <h3>🔧 配件/项目 <span id="itemCount" style="font-size:14px;color:var(--text2);font-weight:400">(0 项)</span></h3>
    <div id="itemsContainer"></div>
    <button class="add-item-btn" onclick="addItem()">+ 添加配件/项目</button>
  </div>
  <div class="form-section">
    <h3>💰 本单汇总</h3>
    <div class="form-group">
      <label>总成本</label>
      <div style="font-size:24px;font-weight:700;color:var(--text2)" id="totalCostDisplay">¥0</div>
    </div>
    <div class="form-group">
      <label>总收入</label>
      <div style="font-size:24px;font-weight:700;color:#4caf50" id="totalIncomeDisplay">¥0</div>
    </div>
    <div class="form-group">
      <label>利润</label>
      <div style="font-size:24px;font-weight:700;color:#ff8f00" id="totalProfitDisplay">¥0</div>
    </div>
  </div>
  <div class="form-actions">
    <button class="btn-cancel" onclick="cancelAdd()">取消</button>
    <button class="btn-save" onclick="saveRecord()">💾 保存</button>
  </div>
</div>

<div id="detailView" class="view">
  <div class="detail-header">
    <h2 id="detailTitle">记录详情</h2>
    <button onclick="showView('mainView')">← 返回</button>
  </div>
  <div class="detail-summary" id="detailSummary"></div>
  <h3 style="font-size:16px;color:var(--accent2);margin-bottom:8px;padding:0 4px">📋 项目明细（点击可朗读）</h3>
  <div class="detail-items" id="detailItems"></div>
  <div class="detail-actions">
    <button class="btn-back" onclick="showView('mainView')">← 返回列表</button>
    <button class="btn-delete" onclick="deleteCurrentRecord()">🗑️ 删除</button>
  </div>
</div>

<div id="settingsView" class="view">
  <div class="settings-section">
    <h3>💰 定价规则</h3>
    <div class="setting-row">
      <label>加价倍率</label>
      <input type="number" id="setMarkup" value="2" min="1" max="10" step="0.1">
    </div>
    <div class="setting-row">
      <label>基础费（元）</label>
      <input type="number" id="setBaseFee" value="0" min="0" step="1">
    </div>
    <div class="setting-row">
      <label>取整到（元）</label>
      <input type="number" id="setRounding" value="1" min="1" step="1">
    </div>
    <div style="padding:8px 0;font-size:14px;color:var(--text2)">
      推荐价 = 向上取整(成本 × 倍率, 取整) + 基础费
    </div>
  </div>
  <div class="settings-section">
    <h3>☁️ 数据同步（数据胶囊 WebDAV）</h3>
    <div class="form-group">
      <label>WebDAV 地址</label>
      <input type="url" id="setWebdavUrl" placeholder="https://dav.jianguo.com/..." style="width:100%;background:var(--card2);border:1px solid rgba(255,255,255,.1);color:var(--text);padding:12px 14px;border-radius:8px;font-size:16px;outline:none">
    </div>
    <div class="form-group">
      <label>用户名</label>
      <input type="text" id="setWebdavUser" placeholder="WebDAV 用户名" style="width:100%;background:var(--card2);border:1px solid rgba(255,255,255,.1);color:var(--text);padding:12px 14px;border-radius:8px;font-size:16px;outline:none">
    </div>
    <div class="form-group">
      <label>密码</label>
      <input type="password" id="setWebdavPass" placeholder="WebDAV 密码" style="width:100%;background:var(--card2);border:1px solid rgba(255,255,255,.1);color:var(--text);padding:12px 14px;border-radius:8px;font-size:16px;outline:none">
    </div>
    <button class="settings-btn success" onclick="backupToWebdav()">☁️ 备份到数据胶囊</button>
    <button class="settings-btn" onclick="restoreFromWebdav()" style="margin-top:8px">📥 从数据胶囊恢复</button>
    <div style="margin-top:12px;font-size:14px;color:var(--text2);background:var(--card2);padding:10px;border-radius:8px">
      ⚡ 提示：数据保存在手机本地，备份是手动操作。建议每次修完车后点一次备份。
    </div>
  </div>
  <div class="settings-section">
    <h3>📊 数据管理</h3>
    <button class="settings-btn" onclick="exportData()">📤 导出数据（JSON）</button>
    <button class="settings-btn danger" onclick="clearAllData()" style="margin-top:8px">🗑️ 清空所有数据</button>
  </div>
  <div class="settings-section">
    <h3>ℹ️ 关于</h3>
    <div style="font-size:15px;color:var(--text2);line-height:2">
      <div>汽修记账助手 v0.1</div>
      <div>数据存储：手机本地 (localStorage)</div>
      <div>云端同步：数据胶囊 WebDAV</div>
      <div>语音识别：浏览器原生 Web Speech API</div>
    </div>
    <button class="settings-btn" onclick="showView('mainView')" style="margin-top:12px">← 返回主页</button>
  </div>
</div>

<div id="voiceOverlay">
  <div class="vo-box">
    <span class="vo-mic" id="voMicIcon">🎤</span>
    <div class="vo-status" id="voStatus">正在聆听，请说话...</div>
    <div class="vo-result" id="voResult"></div>
    <div class="vo-buttons">
      <button class="vo-cancel" onclick="cancelVoice()">取消</button>
      <button class="vo-confirm" onclick="confirmVoice()">✓ 确认</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ============ State ============
var records = [];
var settings = {};
var currentRecordId = null;
var editingItems = [];
var itemIdCounter = 0;
var voiceTargetField = null;
var voiceRecognition = null;
var voiceResultText = "";
var detailViewRecordId = null;
var settingsChanged = false;

// ============ Init ============
function init() {
  loadSettings();
  loadRecords();
  document.getElementById("recDate").value = new Date().toISOString().slice(0,10);
  renderList();
}

// ============ Data ============
function loadRecords() {
  try {
    var d = localStorage.getItem("garage_records");
    records = d ? JSON.parse(d) : [];
  } catch(e) { records = []; }
}

function saveRecords() {
  try {
    localStorage.setItem("garage_records", JSON.stringify(records));
  } catch(e) { toast("保存失败: " + e.message); }
}

function loadSettings() {
  try {
    var d = localStorage.getItem("garage_settings");
    settings = d ? JSON.parse(d) : { markupRate: 2, baseFee: 0, rounding: 1 };
  } catch(e) {
    settings = { markupRate: 2, baseFee: 0, rounding: 1 };
  }
  document.getElementById("setMarkup").value = settings.markupRate || 2;
  document.getElementById("setBaseFee").value = settings.baseFee || 0;
  document.getElementById("setRounding").value = settings.rounding || 1;
  try {
    var wd = localStorage.getItem("garage_webdav");
    if (wd) {
      var w = JSON.parse(wd);
      document.getElementById("setWebdavUrl").value = w.url || "";
      document.getElementById("setWebdavUser").value = w.user || "";
      document.getElementById("setWebdavPass").value = w.pass || "";
    }
  } catch(e) {}
}

function saveSettings() {
  settings.markupRate = parseFloat(document.getElementById("setMarkup").value) || 2;
  settings.baseFee = parseFloat(document.getElementById("setBaseFee").value) || 0;
  settings.rounding = parseInt(document.getElementById("setRounding").value) || 1;
  try {
    localStorage.setItem("garage_settings", JSON.stringify(settings));
  } catch(e) {}
  try {
    localStorage.setItem("garage_webdav", JSON.stringify({
      url: document.getElementById("setWebdavUrl").value,
      user: document.getElementById("setWebdavUser").value,
      pass: document.getElementById("setWebdavPass").value
    }));
  } catch(e) {}
}

// ============ Views ============
function showView(viewId) {
  var views = document.querySelectorAll(".view");
  for (var i = 0; i < views.length; i++) views[i].classList.remove("active");
  document.getElementById(viewId).classList.add("active");
  if (viewId === "mainView") renderList();
  if (viewId === "settingsView") loadSettings();
}

// ============ List ============
function renderList() {
  var container = document.getElementById("recordList");
  var count = document.getElementById("recordCount");
  if (!records.length) {
    container.innerHTML = "<div class=\"empty-state\"><span class=\"big-icon\">🔧</span>还没有记录<br>点右下角 + 开始记账</div>";
    count.textContent = "0 条";
    return;
  }
  var sorted = records.slice().sort(function(a,b) {
    if (a.date !== b.date) return a.date < b.date ? 1 : -1;  // 日期降序
    return a.id < b.id ? 1 : -1;  // 同日期, id 降序(新的在前)
  });
  count.textContent = sorted.length + " 条";
  var html = "";
  for (var i = 0; i < sorted.length; i++) {
    var r = sorted[i];
    var totalIncome = 0;
    var totalCost = 0;
    var itemCount = (r.items || []).length;
    for (var j = 0; j < (r.items || []).length; j++) {
      totalIncome += parseFloat(r.items[j].finalPrice) || 0;
      totalCost += parseFloat(r.items[j].cost) || 0;
      totalCost += parseFloat(r.items[j].shipping) || 0;
    }
    html += "<div class=\"record-card\" data-id=\"" + r.id + "\" onclick=\"showDetail(this.dataset.id)\" data-speak=\"日期" + r.date + ",车牌" + r.plate + ",共" + itemCount + "项,成本" + totalCost + "元,实收" + totalIncome + "元\">" +
      "<div class=\"rc-top\"><span class=\"rc-plate\">" + escHtml(r.plate) + "</span><span class=\"rc-date\">" + r.date + "</span></div>" +
      "<div class=\"rc-bottom\"><span class=\"rc-cost\">成本 ¥" + totalCost + " · " + itemCount + "项</span><span class=\"rc-price\">实收 ¥" + totalIncome + "</span></div></div>";
  }
  container.innerHTML = html;
}

function escHtml(s) {
  var d = document.createElement("div");
  d.textContent = s || "";
  return d.innerHTML;
}

// ============ New Record ============
function startNewRecord() {
  currentRecordId = null;
  editingItems = [];
  itemIdCounter = 0;
  document.getElementById("recDate").value = new Date().toISOString().slice(0,10);
  document.getElementById("recPlate").value = "";
  document.getElementById("recCustomer").value = "";
  document.getElementById("itemsContainer").innerHTML = "";
  document.getElementById("itemCount").textContent = "(0 项)";
  updateTotals();
  showView("addView");
}

function cancelAdd() {
  if (editingItems.length > 0 || document.getElementById("recPlate").value) {
    if (!confirm("确定取消？未保存的数据将丢失。")) return;
  }
  showView("mainView");
}

// ============ Items ============
function addItem(part, cost, shipping, finalPrice) {
  var id = ++itemIdCounter;
  editingItems.push({ id: id, part: part || "", cost: cost || 0, shipping: shipping || 0, finalPrice: finalPrice || 0 });
  renderItems();
}

function removeItem(id) {
  editingItems = editingItems.filter(function(i) { return i.id !== id; });
  renderItems();
}

function updateItemField(id, field, value) {
  var item = null;
  for (var i = 0; i < editingItems.length; i++) {
    if (editingItems[i].id === id) { item = editingItems[i]; break; }
  }
  if (!item) return;
  item[field] = value;
  if (field === "cost" || field === "shipping") {
    var totalCost = (parseFloat(item.cost) || 0) + (parseFloat(item.shipping) || 0);
    var recommended = calcRecommended(totalCost);
    if (!item.finalPrice || item.finalPrice === 0) {
      item.finalPrice = recommended;
    }
  }
  renderItems();
  updateTotals();
}

function calcRecommended(cost) {
  var rate = settings.markupRate || 2;
  var base = settings.baseFee || 0;
  var round = settings.rounding || 1;
  var raw = cost * rate + base;
  if (round <= 1) return Math.round(raw);
  return Math.ceil(raw / round) * round;
}

function updateTotals() {
  var totalCost = 0;
  var totalIncome = 0;
  for (var i = 0; i < editingItems.length; i++) {
    totalCost += parseFloat(editingItems[i].cost) || 0;
    totalCost += parseFloat(editingItems[i].shipping) || 0;
    totalIncome += parseFloat(editingItems[i].finalPrice) || 0;
  }
  var profit = totalIncome - totalCost;
  document.getElementById("totalCostDisplay").textContent = "¥" + totalCost;
  document.getElementById("totalIncomeDisplay").textContent = "¥" + totalIncome;
  document.getElementById("totalProfitDisplay").textContent = "¥" + profit;
  document.getElementById("itemCount").textContent = "(" + editingItems.length + " 项)";
}

function renderItems() {
  var container = document.getElementById("itemsContainer");
  var html = "";
  for (var i = 0; i < editingItems.length; i++) {
    var item = editingItems[i];
    var totalCost = (parseFloat(item.cost) || 0) + (parseFloat(item.shipping) || 0);
    var recommended = calcRecommended(totalCost);
    var partName = escHtml(item.part);
    html += "<div class=\"item-card\" data-speak=\"配件" + partName + ",成本" + totalCost + "元,推荐价" + recommended + "元,实收" + (item.finalPrice || 0) + "元\">" +
      "<button class=\"del-item\" onclick=\"removeItem(" + item.id + ")\">✕</button>" +
      "<div class=\"item-row\"><span class=\"item-label\">🔧 配件</span>" +
        "<input type=\"text\" style=\"flex:1;background:var(--card);border:1px solid rgba(255,255,255,.1);color:var(--text);padding:8px 10px;border-radius:6px;font-size:16px;outline:none\" value=\"" + partName + "\" oninput=\"updateItemField(" + item.id + ",'part',this.value)\" placeholder=\"配件名称\">" +
        "<button class=\"mic-btn\" style=\"width:40px;height:40px;font-size:18px\" onclick=\"startVoice('item_part_" + item.id + "')\">🎤</button>" +
      "</div>" +
      "<div class=\"item-row\"><span class=\"item-label\">💵 成本</span>" +
        "<input type=\"number\" style=\"flex:1;background:var(--card);border:1px solid rgba(255,255,255,.1);color:var(--text);padding:8px 10px;border-radius:6px;font-size:16px;outline:none\" value=\"" + (item.cost || "") + "\" oninput=\"updateItemField(" + item.id + ",'cost',parseFloat(this.value)||0)\" placeholder=\"0\" inputmode=\"decimal\">" +
      "</div>" +
      "<div class=\"item-row\"><span class=\"item-label\">📦 运费</span>" +
        "<input type=\"number\" style=\"flex:1;background:var(--card);border:1px solid rgba(255,255,255,.1);color:var(--text);padding:8px 10px;border-radius:6px;font-size:16px;outline:none\" value=\"" + (item.shipping || "") + "\" oninput=\"updateItemField(" + item.id + ",'shipping',parseFloat(this.value)||0)\" placeholder=\"0\" inputmode=\"decimal\">" +
      "</div>" +
      "<div class=\"item-row\"><span class=\"item-label\">📊 推荐</span><span class=\"item-val cost\">¥" + totalCost + " → <strong style=\"color:var(--accent2)\">¥" + recommended + "</strong></span></div>" +
      "<div class=\"item-row\"><span class=\"item-label\">💰 实收</span>" +
        "<input type=\"number\" style=\"flex:1;background:var(--card);border:2px solid var(--accent);color:#4caf50;padding:8px 10px;border-radius:6px;font-size:18px;font-weight:700;outline:none\" value=\"" + (item.finalPrice || "") + "\" oninput=\"updateItemField(" + item.id + ",'finalPrice',parseFloat(this.value)||0)\" placeholder=\"" + recommended + "\" inputmode=\"decimal\">" +
      "</div></div>";
  }
  container.innerHTML = html;
}

// ============ Save ============
function saveRecord() {
  var date = document.getElementById("recDate").value;
  var plate = document.getElementById("recPlate").value.trim();
  var customer = document.getElementById("recCustomer").value.trim();
  if (!date) { toast("请选择日期"); return; }
  if (!plate) { toast("请输入车牌号"); return; }
  if (editingItems.length === 0) { toast("请至少添加一个配件/项目"); return; }
  for (var i = 0; i < editingItems.length; i++) {
    if (!editingItems[i].part) { toast("请填写配件名称"); return; }
  }
  var items = [];
  var totalCost = 0;
  var totalIncome = 0;
  for (var i = 0; i < editingItems.length; i++) {
    var ei = editingItems[i];
    var cost = parseFloat(ei.cost) || 0;
    var shipping = parseFloat(ei.shipping) || 0;
    var tc = cost + shipping;
    var rp = calcRecommended(tc);
    var fp = parseFloat(ei.finalPrice) || 0;
    items.push({ part: ei.part, cost: cost, shipping: shipping, totalCost: tc, recommendedPrice: rp, finalPrice: fp });
    totalCost += tc;
    totalIncome += fp;
  }
  var record = {
    id: currentRecordId || Date.now().toString() + "_" + Math.random().toString(36).slice(2,6),
    date: date,
    plate: plate,
    customer: customer,
    items: items,
    totalCost: totalCost,
    totalIncome: totalIncome,
    createdAt: new Date().toISOString()
  };
  if (currentRecordId) {
    for (var i = 0; i < records.length; i++) {
      if (records[i].id === currentRecordId) { records[i] = record; break; }
    }
  } else {
    records.push(record);
  }
  saveRecords();
  toast("✅ 保存成功！共 " + items.length + " 项，应收 ¥" + totalIncome);
  settingsChanged = true;
  showView("mainView");
}

// ============ Detail ============
function showDetail(id) {
  var record = null;
  for (var i = 0; i < records.length; i++) {
    if (records[i].id === id) { record = records[i]; break; }
  }
  if (!record) { toast("记录不存在"); return; }
  detailViewRecordId = id;
  document.getElementById("detailTitle").textContent = "🚗 " + record.plate + " (" + record.date + ")";
  var profit = record.totalIncome - record.totalCost;
  var summaryHtml = "<div class=\"ds-row\"><span class=\"ds-label\">📅 日期</span><span class=\"ds-value\">" + record.date + "</span></div>" +
    "<div class=\"ds-row\"><span class=\"ds-label\">🚗 车牌</span><span class=\"ds-value\">" + escHtml(record.plate) + "</span></div>";
  if (record.customer) {
    summaryHtml += "<div class=\"ds-row\"><span class=\"ds-label\">👤 客户</span><span class=\"ds-value\">" + escHtml(record.customer) + "</span></div>";
  }
  summaryHtml += "<div class=\"ds-row\"><span class=\"ds-label\">🔧 项目数</span><span class=\"ds-value\">" + (record.items || []).length + " 项</span></div>" +
    "<div class=\"ds-row\"><span class=\"ds-label\">💰 总成本</span><span class=\"ds-value\">¥" + record.totalCost + "</span></div>" +
    "<div class=\"ds-row\"><span class=\"ds-label\">💵 总收入</span><span class=\"ds-value green\">¥" + record.totalIncome + "</span></div>" +
    "<div class=\"ds-row\"><span class=\"ds-label\">📈 利润</span><span class=\"ds-value " + (profit >= 0 ? "green" : "red") + "\">¥" + profit + "</span></div>";
  document.getElementById("detailSummary").innerHTML = summaryHtml;

  var itemsHtml = "";
  for (var i = 0; i < (record.items || []).length; i++) {
    var item = record.items[i];
    itemsHtml += "<div class=\"detail-item\" onclick=\"speak('配件" + (i+1) + "：" + escHtml(item.part) + "，成本" + item.totalCost + "元，推荐价" + item.recommendedPrice + "元，实收" + (item.finalPrice || 0) + "元')\" data-speak=\"yes\">" +
      "<div class=\"di-name\">" + (i+1) + ". " + escHtml(item.part) + " <button class=\"speak-btn\" onclick=\"event.stopPropagation();speak('" + escHtml(item.part) + "')\">🔊</button></div>" +
      "<div class=\"di-details\">" +
        "<span>成本: ¥" + item.totalCost + "</span>" +
        "<span>推荐: ¥" + item.recommendedPrice + "</span>" +
        "<span class=\"di-price\">实收: ¥" + (item.finalPrice || 0) + "</span>" +
      "</div></div>";
  }
  document.getElementById("detailItems").innerHTML = itemsHtml;
  showView("detailView");
}

function deleteCurrentRecord() {
  if (!detailViewRecordId) return;
  if (!confirm("确定删除这条记录？此操作不可恢复。")) return;
  records = records.filter(function(r) { return r.id !== detailViewRecordId; });
  saveRecords();
  toast("已删除");
  detailViewRecordId = null;
  showView("mainView");
}

// ============ Voice Input ============
function startVoice(targetField) {
  voiceTargetField = targetField;
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) {
    toast("⚠️ 您的浏览器不支持语音识别，请使用 Chrome 浏览器");
    return;
  }
  voiceResultText = "";
  document.getElementById("voResult").textContent = "...";
  document.getElementById("voStatus").textContent = "🎤 正在聆听，请说话...";
  document.getElementById("voMicIcon").className = "vo-mic listening";
  document.getElementById("voiceOverlay").classList.add("active");
  try {
    voiceRecognition = new SR();
    voiceRecognition.lang = "zh-CN";
    voiceRecognition.continuous = false;
    voiceRecognition.interimResults = true;
    voiceRecognition.maxAlternatives = 3;
    voiceRecognition.onresult = function(e) {
      var finalText = "";
      for (var i = e.resultIndex; i < e.results.length; i++) {
        if (e.results[i].isFinal) {
          finalText = e.results[i][0].transcript;
        } else {
          document.getElementById("voResult").textContent = e.results[i][0].transcript + "...";
        }
      }
      if (finalText) {
        voiceResultText = finalText;
        document.getElementById("voResult").textContent = finalText;
        document.getElementById("voStatus").textContent = "✅ 识别完成";
        document.getElementById("voMicIcon").className = "vo-mic";
      }
    };
    voiceRecognition.onerror = function(e) {
      var msg = e.error === "no-speech" ? "未检测到语音" : e.error;
      document.getElementById("voStatus").textContent = "❌ 识别失败: " + msg;
      document.getElementById("voMicIcon").className = "vo-mic";
      setTimeout(function() { document.getElementById("voiceOverlay").classList.remove("active"); }, 2000);
    };
    voiceRecognition.onend = function() {
      if (!voiceResultText) {
        document.getElementById("voStatus").textContent = "⏳ 未识别到内容，请重试";
        document.getElementById("voMicIcon").className = "vo-mic";
      }
    };
    voiceRecognition.start();
  } catch(e) {
    toast("语音识别启动失败: " + e.message);
    document.getElementById("voiceOverlay").classList.remove("active");
  }
}

function confirmVoice() {
  if (voiceRecognition) {
    try { voiceRecognition.stop(); } catch(e) {}
  }
  document.getElementById("voiceOverlay").classList.remove("active");
  if (!voiceTargetField || !voiceResultText) return;
  if (voiceTargetField.indexOf("item_part_") === 0) {
    var id = parseInt(voiceTargetField.replace("item_part_", ""), 10);
    for (var i = 0; i < editingItems.length; i++) {
      if (editingItems[i].id === id) { editingItems[i].part = voiceResultText; break; }
    }
    renderItems();
  } else {
    var el = document.getElementById(voiceTargetField);
    if (el) el.value = voiceResultText;
  }
  toast("已录入: " + voiceResultText);
}

function cancelVoice() {
  if (voiceRecognition) {
    try { voiceRecognition.stop(); } catch(e) {}
  }
  document.getElementById("voiceOverlay").classList.remove("active");
}

// ============ TTS ============
function speak(text) {
  if (!text) return;
  if (!window.speechSynthesis) {
    toast("⚠️ 您的浏览器不支持朗读功能");
    return;
  }
  window.speechSynthesis.cancel();
  var utter = new SpeechSynthesisUtterance(text);
  utter.lang = "zh-CN";
  utter.rate = 0.9;
  utter.pitch = 1.0;
  var voices = window.speechSynthesis.getVoices();
  for (var i = 0; i < voices.length; i++) {
    if (voices[i].lang.indexOf("zh") === 0) { utter.voice = voices[i]; break; }
  }
  window.speechSynthesis.speak(utter);
}

// ============ Toast ============
function toast(msg) {
  var el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(el._timer);
  el._timer = setTimeout(function() { el.classList.remove("show"); }, 2500);
}

// ============ Settings ============
document.addEventListener("input", function(e) {
  var id = e.target.id;
  if (id.indexOf("set") === 0 && id !== "setWebdavUrl" && id !== "setWebdavUser" && id !== "setWebdavPass") {
    saveSettings();
  }
});

document.addEventListener("blur", function(e) {
  var id = e.target.id;
  if (id.indexOf("setWebdav") === 0) saveSettings();
}, true);

// ============ Export ============
function exportData() {
  var data = JSON.stringify({ records: records, settings: settings, exportedAt: new Date().toISOString() }, null, 2);
  var blob = new Blob([data], { type: "application/json" });
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  a.href = url;
  a.download = "garage_backup_" + new Date().toISOString().slice(0,10) + ".json";
  a.click();
  URL.revokeObjectURL(url);
  toast("📤 导出成功");
}

function clearAllData() {
  if (!confirm("⚠️ 确定要清空所有数据吗？此操作不可恢复！\n建议先点「导出数据」备份。")) return;
  if (!confirm("再次确认：删除所有记账记录和设置？")) return;
  records = [];
  saveRecords();
  toast("🗑️ 已清空所有数据");
  showView("mainView");
}

// ============ WebDAV ============
function backupToWebdav() {
  var url = document.getElementById("setWebdavUrl").value.trim();
  var user = document.getElementById("setWebdavUser").value.trim();
  var pass = document.getElementById("setWebdavPass").value.trim();
  if (!url) { toast("⚠️ 请先填写 WebDAV 地址"); return; }
  if (!user || !pass) { toast("⚠️ 请填写 WebDAV 用户名和密码"); return; }
  saveSettings();
  toast("☁️ 正在备份...");
  var data = JSON.stringify({ records: records, settings: settings, exportedAt: new Date().toISOString() }, null, 2);
  var filename = "garage_backup_" + new Date().toISOString().slice(0,10) + ".json";
  var auth = btoa(user + ":" + pass);
  fetch(url + filename, {
    method: "PUT",
    headers: {
      "Authorization": "Basic " + auth,
      "Content-Type": "application/json"
    },
    body: data
  }).then(function(res) {
    if (res.ok || res.status === 201 || res.status === 204) {
      toast("✅ 备份成功！文件: " + filename);
      settingsChanged = false;
    } else {
      toast("❌ 备份失败: HTTP " + res.status);
    }
  }).catch(function(err) {
    toast("❌ 备份失败: " + err.message);
  });
}

function restoreFromWebdav() {
  var url = document.getElementById("setWebdavUrl").value.trim();
  var user = document.getElementById("setWebdavUser").value.trim();
  var pass = document.getElementById("setWebdavPass").value.trim();
  if (!url) { toast("⚠️ 请先填写 WebDAV 地址"); return; }
  toast("📥 正在从数据胶囊恢复...");
  var auth = btoa(user + ":" + pass);
  fetch(url, {
    method: "PROPFIND",
    headers: {
      "Authorization": "Basic " + auth,
      "Depth": "1"
    }
  }).then(function(res) {
    if (!res.ok) throw new Error("HTTP " + res.status);
    return res.text();
  }).then(function(xml) {
    var parser = new DOMParser();
    var doc = parser.parseFromString(xml, "text/xml");
    var hrefs = doc.querySelectorAll("D\\:href, d\\:href");
    var files = [];
    hrefs.forEach(function(h) {
      var name = h.textContent;
      if (name && name.indexOf("garage_backup") >= 0 && name.indexOf(".json") >= 0) {
        files.push(name);
      }
    });
    if (files.length === 0) {
      throw new Error("未找到备份文件");
    }
    files.sort().reverse();
    var latestFile = files[0];
    return fetch(url + latestFile, {
      headers: { "Authorization": "Basic " + auth }
    }).then(function(r) {
      if (!r.ok) throw new Error("读取失败");
      return r.json();
    }).then(function(data) {
      if (data.records && Array.isArray(data.records)) {
        records = data.records;
        if (data.settings) settings = data.settings;
        saveRecords();
        saveSettings();
        toast("✅ 恢复成功！共 " + records.length + " 条记录");
        showView("mainView");
      } else {
        throw new Error("备份文件格式错误");
      }
    });
  }).catch(function(err) {
    toast("❌ 恢复失败: " + err.message);
  });
}

// ============ Keyboard ============
document.addEventListener("keydown", function(e) {
  if (e.key === "Escape") {
    var overlay = document.getElementById("voiceOverlay");
    if (overlay.classList.contains("active")) cancelVoice();
  }
});

// ============ Preload voices ============
if (window.speechSynthesis) {
  window.speechSynthesis.getVoices();
  window.speechSynthesis.onvoiceschanged = function() {
    window.speechSynthesis.getVoices();
  };
}

// ============ Start ============
init();
</script>
